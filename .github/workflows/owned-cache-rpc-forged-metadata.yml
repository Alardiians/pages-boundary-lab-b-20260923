name: Owned cache RPC metadata boundary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read_scope:
    runs-on: ubuntu-24.04
    steps:
      - name: Compare owned cache metadata scopes
        uses: actions/github-script@v7
        with:
          script: |
            const crypto = require('crypto');
            const token = process.env.ACTIONS_RUNTIME_TOKEN;
            const root = process.env.ACTIONS_RESULTS_URL;
            if (!token || !root || !process.env.ACTIONS_CACHE_SERVICE_V2) {
              throw new Error('Cache v2 runtime context unavailable');
            }
            const endpoint = new URL('/twirp/github.actions.results.api.v1.CacheService/GetCacheEntryDownloadURL', root);
            const version = crypto.createHash('sha256').update('probe/cache.txt|zstd-without-long|1.0').digest('hex');
            const ownKey = 'owned-public-to-private-cache-4c9d57f483da4b83a7c713fbf65264d1';
            const privateKey = 'owned-crossrepo-cache-26ef258f919745f4b479e784b33e2f06';
            const expectedPrivateArchive = '5a1f7b4ee94a67f0112360ccff5a4ab018ce99181e9f106c9ffd844a9c3c4d9c';
            const cases = [
              ['OWN_PUBLIC', ownKey, undefined],
              ['OTHER_PRIVATE_BASELINE', privateKey, undefined],
              ['OTHER_PRIVATE_OWN_ID', privateKey, {repositoryId: '1383426615', scope: [{scope: 'refs/heads/main', permission: '1'}]}],
              ['OTHER_PRIVATE_TARGET_ID', privateKey, {repositoryId: '1383293949', scope: [{scope: 'refs/heads/main', permission: '1'}]}]
            ];
            for (const [label, key, metadata] of cases) {
              const request = {key, restoreKeys: [], version};
              if (metadata) request.metadata = metadata;
              const response = await fetch(endpoint, {
                method: 'POST',
                headers: {Authorization: `Bearer ${token}`, 'Content-Type': 'application/json'},
                body: JSON.stringify(request)
              });
              const body = await response.json();
              const signedUrl = body.signed_download_url || body.signedDownloadUrl;
              console.log(`${label}_RPC_STATUS=${response.status}`);
              console.log(`${label}_RPC_OK=${body.ok === true}`);
              console.log(`${label}_SIGNED_URL_PRESENT=${Boolean(signedUrl)}`);
              if (signedUrl) {
                const archive = await fetch(signedUrl);
                const bytes = Buffer.from(await archive.arrayBuffer());
                const digest = crypto.createHash('sha256').update(bytes).digest('hex');
                console.log(`${label}_ARCHIVE_STATUS=${archive.status}`);
                console.log(`${label}_ARCHIVE_BYTES=${bytes.length}`);
                console.log(`${label}_MATCHES_OWNED_PRIVATE_ARCHIVE=${archive.status === 200 && digest === expectedPrivateArchive}`);
              }
            }
