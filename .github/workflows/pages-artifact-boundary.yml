name: Owned Pages artifact boundary probe

on:
  workflow_dispatch:
    inputs:
      oidc_boundary:
        description: Test whether a read-only job can use this workflow's existing OIDC-enabled job URL
        type: boolean
        default: false
      attestation_boundary:
        description: Test whether the existing OIDC-enabled job can attest an inert subject without attestations write
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    outputs:
      oidc_request_url: ${{ steps.oidc_endpoint.outputs.request_url }}
    environment:
      name: github-pages
      url: ${{ steps.own_deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ !inputs.oidc_boundary && !inputs.attestation_boundary }}
      - name: Package only the owned synthetic page
        if: ${{ !inputs.oidc_boundary && !inputs.attestation_boundary }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Ask Pages to deploy a foreign owned-repository artifact
        if: ${{ !inputs.oidc_boundary && !inputs.attestation_boundary }}
        id: foreign_probe
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          oidc="$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}" | jq -r .value)"
          test -n "$oidc" && test "$oidc" != "null"
          jq -n \
            --arg oidc "$oidc" \
            --arg version "$GITHUB_SHA" \
            --argjson artifact_id 10750302140 \
            '{artifact_id:$artifact_id,pages_build_version:$version,oidc_token:$oidc}' > request.json
          status="$(curl --silent --show-error \
            --output response.json \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            --header 'Content-Type: application/json' \
            --data-binary @request.json \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments")"
          rm -f request.json
          printf 'FOREIGN_ARTIFACT_HTTP_STATUS=%s\n' "$status"
          jq -c '{message,documentation_url,status,id,page_url}' response.json
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Establish Pages deployment with the local artifact
        if: ${{ !inputs.oidc_boundary && !inputs.attestation_boundary && steps.foreign_probe.outputs.status != '200' }}
        id: own_deploy
        uses: actions/deploy-pages@v5
      - name: Verify existing OIDC access and pass URL only
        if: ${{ inputs.oidc_boundary }}
        id: oidc_endpoint
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'],
              headers={'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']},
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              token = json.load(response)['value']
          payload = json.loads(base64.urlsafe_b64decode(token.split('.')[1] + '==='))
          print('HIGH_OIDC_REQUEST_STATUS=200')
          print('HIGH_OIDC_SUB=' + str(payload.get('sub', '')))
          print('HIGH_OIDC_REPOSITORY_ID=' + str(payload.get('repository_id', '')))
          print('HIGH_OIDC_RUN_ID=' + str(payload.get('run_id', '')))
          PY
          printf 'request_url=%s\n' "$ACTIONS_ID_TOKEN_REQUEST_URL" >> "$GITHUB_OUTPUT"
      - name: Create inert subject for attestation ACL check
        if: ${{ inputs.attestation_boundary }}
        shell: bash
        run: printf '%s\n' 'OWNED_ATTESTATION_CANARY=0f18a35aa48b475f8e3dcfb63719d621' > synthetic-subject.txt
      - name: Attempt attestation without attestations write
        if: ${{ inputs.attestation_boundary }}
        id: attestation_attempt
        continue-on-error: true
        uses: actions/attest@v4
        with:
          subject-path: synthetic-subject.txt
      - name: Record bounded attestation outcome
        if: ${{ inputs.attestation_boundary }}
        shell: bash
        run: printf 'ATTEST_ACTION_OUTCOME=%s\n' '${{ steps.attestation_attempt.outcome }}'
  oidc_read_only:
    if: ${{ inputs.oidc_boundary }}
    needs: probe
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Test the read-only job bearer against the OIDC-enabled job URL
        uses: actions/github-script@v7
        env:
          HIGH_OIDC_REQUEST_URL: ${{ needs.probe.outputs.oidc_request_url }}
        with:
          script: |
            const url = process.env.HIGH_OIDC_REQUEST_URL;
            const runtimeToken = process.env.ACTIONS_RUNTIME_TOKEN;
            console.log(`LOW_RUNTIME_TOKEN_PRESENT=${Boolean(runtimeToken)}`);
            console.log(`LOW_OIDC_REQUEST_URL_PRESENT=${Boolean(process.env.ACTIONS_ID_TOKEN_REQUEST_URL)}`);
            if (!url || !runtimeToken) {
              core.setFailed('The required URL or low-job runtime bearer was unavailable');
              return;
            }
            const response = await fetch(url, {
              headers: {Authorization: `Bearer ${runtimeToken}`},
              redirect: 'error'
            });
            console.log(`CROSS_JOB_OIDC_HTTP_STATUS=${response.status}`);
            if (response.ok) {
              const body = await response.json();
              const payload = JSON.parse(Buffer.from(body.value.split('.')[1], 'base64url').toString('utf8'));
              console.log(`CROSS_JOB_OIDC_SUB=${payload.sub || ''}`);
              console.log(`CROSS_JOB_OIDC_REPOSITORY_ID=${payload.repository_id || ''}`);
              console.log(`CROSS_JOB_OIDC_RUN_ID=${payload.run_id || ''}`);
            }
